<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>منصة المراجعة — الدخول</title><style>
:root{--navy:#0E1A2B;--gold:#C8A45D;--ivory:#F7F3EA}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 0,#1d3556,var(--navy) 60%);color:var(--ivory);font:18px/1.7 "IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;display:flex;justify-content:center;padding:22px 14px}
.w{width:100%;max-width:560px}header{text-align:center;margin-bottom:14px}h1{font-size:1.9rem;margin:.1em 0;color:var(--gold)}header p{margin:.1em 0;color:#d9d2bf}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(200,164,93,.5);border-radius:20px;padding:18px}
ol{display:flex;list-style:none;gap:8px;padding:0;margin:0 0 14px;justify-content:center}ol li{flex:1;text-align:center;font-size:.9rem;padding:4px;border-bottom:3px solid rgba(255,255,255,.2);color:#a9b4c6}ol li.on{border-color:var(--gold);color:var(--gold);font-weight:700}ol li.done{border-color:#6fae8a;color:#9fd1b5}
h2{margin:.2em 0;font-size:1.3rem}.sub{color:#c8cfdc;margin:.2em 0 .8em}
input{width:100%;font:inherit;font-size:1.15rem;padding:14px;border-radius:14px;border:2px solid rgba(200,164,93,.6);background:#fff;color:var(--navy)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.b{font:inherit;font-weight:700;padding:14px 8px;min-height:56px;border-radius:14px;border:2px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer}
.b[aria-pressed=true]{background:var(--gold);color:var(--navy)}.b.g{font-size:1.15rem}.hint{min-height:1.6em;color:#9fd1b5;font-size:.95rem}
.act{display:flex;gap:10px;margin-top:16px}.act button{flex:1;font:inherit;font-weight:700;padding:14px;border-radius:14px;border:0;cursor:pointer;min-height:52px}
#go{background:var(--gold);color:var(--navy)}#go:disabled{opacity:.4;cursor:not-allowed}#bk{background:rgba(255,255,255,.12);color:var(--ivory)}
.b:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:3px}[hidden]{display:none!important}
footer{text-align:center;margin-top:14px;font-size:.88rem;color:#a9b4c6}
</style></head><body><div class="w"><header><h1>منصة المراجعة</h1><p>مدرسة الخالدية الحلقة الثالثة بنين</p></header>
<section class="card" aria-label="الدخول"><ol id="st"><li data-s="1">الاسم</li><li data-s="2">الصف</li><li data-s="3">الشعبة</li></ol>
<div data-s="1"><h2>ما اسمك الكامل؟</h2><p class="sub">اكتب اسمك كاملًا كما في سجلّ المدرسة.</p><input id="nm" type="text" autocomplete="off" spellcheck="false" placeholder="الاسم الكامل" aria-label="الاسم الكامل"><p class="hint" id="nh"></p></div>
<div data-s="2" hidden><h2>في أي صفٍّ أنت؟</h2><p class="sub" id="hi"></p><div class="grid" id="gr"></div></div>
<div data-s="3" hidden><h2>وما شعبتك؟</h2><p class="sub" id="hi3"></p><div class="grid" id="sc"></div></div>
<div class="act"><button id="bk" type="button" hidden>رجوع</button><button id="go" type="button" disabled>التالي</button></div></section>
<footer>إن كنت لا تعرف شعبتك فاسأل معلمك.</footer></div>
<script>
var K={"9-general": "31Ds1h1MrDRlPGmHMwEVj62pn6FyLekmPEthKmV12nE", "9-advanced": "YDby9NHJcVZd1wwJ0zQLJVkemO3cI2M70yWl-8s0Pus", "10-general": "C9IIEfoLIsNM-z2eXXkIMC_x_hevUEGm7NKBBVht3BE", "10-advanced": "kiPyJwvJ_t3vgMyS0vDnkzAp31_q0PJnqpApfXnv6iA", "11-general": "Ru7UHhjKekDgai6CRalMBCIoinQBmf9ACHB9TugyzVA", "11-advanced": "zXpjY5Nx-VsrFwNUP2TS566Q2Nu6zCsE7gtocd6gLXg", "12-general": "uM_JBeRLy2Y6hLFRvP6xPYsFriggkc6N4qimuAlgHx8", "12-advanced": "_zohgg_ujVXE07cUX6hgWB4GIyVVRNlictzjMRaKIPQ"},C=[{"code": "9A1", "grade": 9, "track": "advanced"}, {"code": "9G1", "grade": 9, "track": "general"}, {"code": "9G2", "grade": 9, "track": "general"}, {"code": "9G3", "grade": 9, "track": "general"}, {"code": "9G4", "grade": 9, "track": "general"}, {"code": "10A1", "grade": 10, "track": "advanced"}, {"code": "10G1", "grade": 10, "track": "general"}, {"code": "10G2", "grade": 10, "track": "general"}, {"code": "10G3", "grade": 10, "track": "general"}, {"code": "11A1", "grade": 11, "track": "advanced"}, {"code": "11G1", "grade": 11, "track": "general"}, {"code": "11G2", "grade": 11, "track": "general"}, {"code": "11G3", "grade": 11, "track": "general"}, {"code": "11G4", "grade": 11, "track": "general"}, {"code": "12A1", "grade": 12, "track": "advanced"}, {"code": "12G1", "grade": 12, "track": "general"}, {"code": "12G2", "grade": 12, "track": "general"}, {"code": "12G3", "grade": 12, "track": "general"}],GN={9:"التاسع",10:"العاشر",11:"الحادي عشر",12:"الثاني عشر"},step=1,grade=0,code="";
var nm=document.getElementById("nm"),go=document.getElementById("go"),bk=document.getElementById("bk");
function words(){return nm.value.trim().split(/ +/).filter(function(w){return w&&["بن","ابن","بنت"].indexOf(w)<0}).length}
function sec(c){return (c.track==="advanced"?"المتقدم ":"العام ")+c.code.replace(/^[0-9]+[AG]/,"")}
function paint(){document.querySelectorAll("[data-s]").forEach(function(e){if(e.tagName==="LI"){var n=+e.dataset.s;e.className=n===step?"on":n<step?"done":""}else e.hidden=+e.dataset.s!==step});
 bk.hidden=step===1;go.textContent=step===3?"ادخل إلى المنصة":"التالي";go.disabled=step===1?words()<3:step===2?!grade:!code;
 document.getElementById("hi").textContent="أهلًا "+nm.value.trim().split(" ")[0]+"، اختر صفّك.";document.getElementById("hi3").textContent=grade?"الصف "+GN[grade]+" — اختر شعبتك.":"";
 if(step===1)nm.focus()}
nm.addEventListener("input",function(){var n=words();document.getElementById("nh").textContent=n===0?"":n<3?"اكتب اسمك كاملًا: "+(3-n)+" من الأسماء على الأقل بعد.":"✓ جاهز";paint()});
nm.addEventListener("keydown",function(e){if(e.key==="Enter"&&!go.disabled)next()});
document.getElementById("gr").innerHTML=[9,10,11,12].map(function(g){return '<button type="button" class="b g" data-g="'+g+'" aria-pressed="false">'+g+" — "+GN[g]+"</button>"}).join("");
document.getElementById("gr").addEventListener("click",function(e){var b=e.target.closest("[data-g]");if(!b)return;grade=+b.dataset.g;code="";
 document.querySelectorAll("#gr .b").forEach(function(x){x.setAttribute("aria-pressed",x===b)});
 document.getElementById("sc").innerHTML=C.filter(function(c){return c.grade===grade}).map(function(c){return '<button type="button" class="b '+c.track+'" data-c="'+c.code+'" aria-pressed="false">'+sec(c)+"</button>"}).join("");paint();setTimeout(next,220)});
document.getElementById("sc").addEventListener("click",function(e){var b=e.target.closest("[data-c]");if(!b)return;code=b.dataset.c;document.querySelectorAll("#sc .b").forEach(function(x){x.setAttribute("aria-pressed",x===b)});paint()});
function finish(){var c=C.filter(function(x){return x.code===code})[0];if(!c)return;
 try{localStorage.setItem("rev1.launch",JSON.stringify({name:nm.value.trim().replace(/ +/g," "),code:code,t:Date.now()}))}catch(e){}
 location.href="https://khalidiya-edu.github.io/g"+c.grade+"-"+c.track+"/go.html#k="+K[c.grade+"-"+c.track]}
function next(){if(go.disabled)return;if(step<3){step++;paint()}else finish()}
go.addEventListener("click",next);bk.addEventListener("click",function(){if(step>1){step--;paint()}});paint();
</script></body></html>
